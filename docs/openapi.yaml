openapi: 3.1.0
info:
  title: Авито.Кухня API
  version: 1.0.0
  description: API для сервиса доставки еды Авито.Кухня
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:8080
    description: Local development

# Public by default; authenticated operations override this with their scheme.
security: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Healthcheck
      tags: [Health]
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/venues:
    get:
      operationId: getApiV1Venues
      summary: Список заведений
      tags: [Venues]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Список заведений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueList'

  /api/v1/venues/{id}:
    get:
      operationId: getApiV1VenuesById
      summary: Детали заведения
      tags: [Venues]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Заведение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/venues/{id}/menu:
    get:
      operationId: getApiV1VenuesByIdMenu
      summary: Меню заведения
      tags: [Menu]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: available
          in: query
          schema:
            type: boolean
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Меню
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /api/v1/venues/{id}/reviews:
    get:
      operationId: getApiV1VenuesByIdReviews
      summary: Отзывы заведения
      tags: [Reviews]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Отзывы
    post:
      operationId: postApiV1VenuesByIdReviews
      summary: Оставить отзыв
      tags: [Reviews]
      security:
        - UserIDHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Отзыв создан
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/cart:
    get:
      operationId: getApiV1Cart
      summary: Получить корзину
      tags: [Cart]
      security:
        - UserIDHeader: []
      parameters:
        - name: venue_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Корзина
    delete:
      operationId: deleteApiV1Cart
      summary: Очистить корзину
      tags: [Cart]
      security:
        - UserIDHeader: []
      parameters:
        - name: venue_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Корзина очищена

  /api/v1/cart/items:
    post:
      operationId: postApiV1CartItems
      summary: Добавить товар в корзину
      tags: [Cart]
      security:
        - UserIDHeader: []
      parameters:
        - name: venue_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Товар добавлен

  /api/v1/cart/items/{id}:
    put:
      operationId: putApiV1CartItemsById
      summary: Обновить количество
      tags: [Cart]
      security:
        - UserIDHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Обновлено
    delete:
      operationId: deleteApiV1CartItemsById
      summary: Удалить товар из корзины
      tags: [Cart]
      security:
        - UserIDHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Удалено

  /api/v1/orders:
    post:
      operationId: postApiV1Orders
      summary: Создать заказ
      tags: [Orders]
      security:
        - UserIDHeader: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 255
            pattern: '^[!-~]{1,255}$'
          description: Повтор с тем же ключом вернёт уже созданный заказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Заказ создан
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: getApiV1Orders
      summary: Список заказов пользователя
      tags: [Orders]
      security:
        - UserIDHeader: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Заказы

  /api/v1/orders/{id}:
    get:
      operationId: getApiV1OrdersById
      summary: Детали заказа
      tags: [Orders]
      security:
        - UserIDHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Заказ

  /api/v1/orders/{id}/track:
    get:
      operationId: getApiV1OrdersByIdTrack
      summary: Отслеживание заказа
      tags: [Orders]
      security:
        - UserIDHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Статус заказа

  /api/v1/orders/{id}/repeat:
    post:
      operationId: postApiV1OrdersByIdRepeat
      summary: Повторить заказ
      tags: [Orders]
      security:
        - UserIDHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Заказ повторён

  /api/v1/venue/menu/categories:
    get:
      operationId: getApiV1VenueMenuCategories
      summary: Категории меню заведения
      tags: [Venue Menu]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Категории
    post:
      operationId: postApiV1VenueMenuCategories
      summary: Создать категорию меню
      tags: [Venue Menu]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                sort_order:
                  type: integer
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Категория создана

  /api/v1/venue/menu:
    get:
      operationId: getApiV1VenueMenu
      summary: Получить меню заведения
      tags: [Venue Menu]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: available
          in: query
          schema:
            type: boolean
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Меню
    post:
      operationId: postApiV1VenueMenu
      summary: Добавить блюдо
      tags: [Venue Menu]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItem'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Блюдо добавлено

  /api/v1/venue/menu/{id}:
    put:
      operationId: putApiV1VenueMenuById
      summary: Обновить блюдо
      tags: [Venue Menu]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Блюдо обновлено
    delete:
      operationId: deleteApiV1VenueMenuById
      summary: Удалить блюдо
      tags: [Venue Menu]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Блюдо удалено

  /api/v1/venue/menu/{id}/availability:
    patch:
      operationId: patchApiV1VenueMenuByIdAvailability
      summary: Изменить доступность
      tags: [Venue Menu]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                available:
                  type: boolean
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Доступность обновлена

  /api/v1/venue/orders:
    get:
      operationId: getApiV1VenueOrders
      summary: Список заказов заведения
      tags: [Venue Orders]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, preparing, ready, delivering, delivered, cancelled]
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Заказы

  /api/v1/venue/orders/{id}:
    get:
      operationId: getApiV1VenueOrdersById
      summary: Детали заказа заведения
      tags: [Venue Orders]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Заказ

  /api/v1/venue/orders/{id}/accept:
    patch:
      operationId: patchApiV1VenueOrdersByIdAccept
      summary: Принять заказ
      tags: [Venue Orders]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Заказ принят

  /api/v1/venue/orders/{id}/reject:
    patch:
      operationId: patchApiV1VenueOrdersByIdReject
      summary: Отклонить заказ
      tags: [Venue Orders]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Заказ отклонён

  /api/v1/venue/orders/{id}/status:
    patch:
      operationId: patchApiV1VenueOrdersByIdStatus
      summary: Обновить статус заказа
      tags: [Venue Orders]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, preparing, ready, delivering, delivered, cancelled]
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Статус обновлён

  /api/v1/notifications/register:
    post:
      operationId: postApiV1NotificationsRegister
      summary: Регистрация push-токена
      tags: [Notifications]
      security:
        - UserIDHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 500
                platform:
                  type: string
                  enum: [ios, android, web]
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Токен уже зарегистрирован другим пользователем
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Токен зарегистрирован
    delete:
      operationId: deleteApiV1NotificationsRegister
      summary: Отозвать push-токен
      tags: [Notifications]
      security:
        - UserIDHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Токен отозван

  /api/v1/notifications:
    get:
      operationId: getApiV1Notifications
      summary: Список уведомлений
      tags: [Notifications]
      security:
        - UserIDHeader: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Уведомления

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: "Bearer token for the venue API key"
    UserIDHeader:
      type: apiKey
      in: header
      name: X-User-ID
      description: "Demo identity only; X-User-ID must be a UUID of an existing users row and is not authentication"

  schemas:
    Venue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        logo_url:
          type: string
        phone:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        working_hours:
          type: object
        is_active:
          type: boolean

    VenueResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Venue'

    VenueList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
        pagination:
          $ref: '#/components/schemas/Pagination'

    MenuItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: integer
          description: Цена в копейках
        image_url:
          type: string
        is_available:
          type: boolean
        options:
          type: array

    CreateReviewRequest:
      type: object
      required: [order_id, rating]
      properties:
        order_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    AddToCartRequest:
      type: object
      required: [menu_item_id]
      properties:
        menu_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          default: 1
          minimum: 1
          maximum: 1000
        options:
          type: object
          additionalProperties:
            type: string

    CreateOrderRequest:
      type: object
      required: [venue_id, delivery_type]
      properties:
        venue_id:
          type: string
          format: uuid
        delivery_type:
          type: string
          enum: [delivery, pickup]
        delivery_address:
          type: string
        comment:
          type: string
        payment_method:
          type: string
          enum: [card, cash, sbp]
          description: card, cash или sbp; по умолчанию card

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: integer
        request_id:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
