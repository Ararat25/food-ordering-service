version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - revive
    - gocyclo
    - gocognit
    - misspell
    - unconvert
    - unparam
    - prealloc
    - noctx
    - nakedret
  settings:
    revive:
      # exported/package-comments отключены осознанно: doc-комментарии на каждую
      # сущность для MVP избыточны, error-strings (строчные тексты ошибок) проверяем.
      rules:
        - name: error-strings
formatters:
  enable:
    - gofmt
    - goimports